<!DOCTYPE html>

<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- CSP stricte : scripts du site uniquement, pas de script inline, pas d'objets, pas de <base>, pas de formulaires natifs.
     frame-src https: : nécessaire pour afficher vos apps dans une fenêtre. connect-src https: : nécessaire pour joindre vos serveurs WebDAV. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src blob:; frame-src https: blob:; connect-src https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
