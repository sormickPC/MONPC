<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Desktop</title><style>
:root{--bg:#0f1b2d;--pn:#1b2a41;--ink:#e8eef7;--ac:#f2b134;--ln:#2e4261;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px "Avenir Next","Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
#desk{position:fixed;inset:0 0 44px 0;background:linear-gradient(135deg,#0f1b2d,#2b3a67 60%,#f2b134 160%) center/cover no-repeat}
#icons{position:absolute;inset:0;padding:12px;display:flex;flex-flow:column wrap;align-content:flex-start;gap:8px}
.ic{width:84px;text-align:center;padding:6px;border-radius:6px;cursor:pointer;position:relative;text-shadow:0 1px 3px #000}
.ic:hover{background:#ffffff22}.ic b{display:block;font-size:30px}.ic span{font-size:12px;word-break:break-word}
.ic i{position:absolute;top:0;right:0;display:none;font-style:normal;background:#000a;border-radius:50%;width:18px;height:18px;line-height:18px}.ic:hover i{display:block}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;background:var(--pn);border-top:1px solid var(--ln);display:flex;gap:4px;align-items:center;padding:0 6px;overflow-x:auto;z-index:99999}
button,select,input{font:inherit;color:inherit;background:#26395a;border:1px solid var(--ln);border-radius:5px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
#bar .sep{width:1px;height:24px;background:var(--ln);margin:0 4px}#bar .tk{max-width:140px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win{position:absolute;background:var(--pn);border:1px solid var(--ln);border-radius:8px;display:flex;flex-direction:column;box-shadow:0 10px 30px #0008;resize:both;overflow:hidden;min-width:260px;min-height:140px}
.win[hidden]{display:none}.win.max{inset:0 0 44px 0!important;width:auto!important;height:auto!important;resize:none;border-radius:0}
.tb{display:flex;gap:4px;align-items:center;padding:4px 6px;background:#13203a;cursor:move;touch-action:none}.tb .tt{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb button{padding:0 8px}.bd{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0}
.bd iframe,.bd video{flex:1;width:100%;border:0;background:#fff;min-height:0}.bd img{max-width:100%;margin:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:90px}
.li{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:5px;cursor:pointer}.li:hover{background:#ffffff14}.li.on{color:var(--ac)}.li span{flex:1}
#ed{flex:1;background:#fff;color:#111;padding:12px;overflow:auto;min-height:120px;outline:0}
.warn{background:#3a2f12;padding:4px 8px;border-radius:5px}small{opacity:.7}
</style></head><body>
<div id="desk"><div id="icons"></div></div><div id="bar"></div>
<script>
/* ===== Utilitaires & état persistant (localStorage ; mots de passe : mémoire seulement) ===== */
const $=(s,r=document)=>r.querySelector(s),el=(t,p={},...c)=>{const e=Object.assign(document.createElement(t),p);e.append(...c);return e};
const S=Object.assign({apps:[],desk:[],wp:{t:'p',v:0,fit:'cover'},pl:{},conns:[],proxy:'',docs:{}},JSON.parse(localStorage.vd||'{}'));
const save=()=>localStorage.vd=JSON.stringify(S),mem={},uid=()=>Math.random().toString(36).slice(2,9);
const ext=n=>(n.split('.').pop()||'').toLowerCase();

/* ===== Gestionnaire de fenêtres ===== */
let Z=10;const bar=$('#bar');
function win(title,body,o={}){
  const w=el('div',{className:'win'}),tb=el('div',{className:'tb'},el('span',{className:'tt',textContent:title}));
  w.style.cssText=`left:${40+Math.random()*100}px;top:${30+Math.random()*60}px;width:${Math.min(o.w||560,innerWidth-10)}px;height:${Math.min(o.h||400,innerHeight-60)}px`;
  const front=()=>w.style.zIndex=++Z,task=el('button',{className:'tk',textContent:title,onclick:()=>{w.hidden=false;front()}});
  const mk=(t,f)=>tb.append(el('button',{textContent:t,title:t,onclick:e=>{e.stopPropagation();f()}}));
  mk('–',()=>w.hidden=true);mk('▢',()=>w.classList.toggle('max'));
  mk('×',()=>{o.onclose&&o.onclose();w.remove();task.remove()});
  tb.onpointerdown=e=>{if(e.target.tagName=='BUTTON'||w.classList.contains('max'))return;front();tb.setPointerCapture(e.pointerId);
    const dx=e.clientX-w.offsetLeft,dy=e.clientY-w.offsetTop;
    tb.onpointermove=m=>{w.style.left=m.clientX-dx+'px';w.style.top=Math.max(0,m.clientY-dy)+'px'};tb.onpointerup=()=>tb.onpointermove=null};
  w.onpointerdown=front;w.append(tb,el('div',{className:'bd'},body));front();$('#desk').append(w);bar.append(task);return w}

/* ===== Fond d'écran ===== */
const PRE=['linear-gradient(135deg,#0f1b2d,#2b3a67 60%,#f2b134 160%)','linear-gradient(160deg,#1d3b2f,#0b1d2a)','linear-gradient(200deg,#4a1d3d,#14213d)','#101418'];
function applyWp(){const d=$('#desk'),w=S.wp;d.style.background=w.t=='p'?PRE[w.v]:`url("${w.v}") center/${w.fit} no-repeat`;if(w.t=='p')d.style.backgroundSize='cover'}
function wpWin(){const fit=el('select',{innerHTML:'<option>cover</option><option>contain</option><option>100% 100%</option>',value:S.wp.fit,onchange:()=>{S.wp.fit=fit.value;save();applyWp()}});
  const url=el('input',{placeholder:'URL d’image'}),pick=el('input',{type:'file',accept:'image/*',onchange:()=>{const r=new FileReader();r.onload=()=>set(r.result);r.readAsDataURL(pick.files[0])}});
  const set=v=>{try{S.wp={t:'u',v,fit:fit.value};save();applyWp()}catch{alert('Image trop lourde pour le stockage local : utilisez une URL.')}};
  win('Fond d’écran',[el('div',{className:'row'},...PRE.map((p,i)=>el('button',{textContent:'Thème '+(i+1),onclick:()=>{S.wp={t:'p',v:i,fit:fit.value};save();applyWp()}}))),
   el('div',{className:'row'},url,el('button',{textContent:'Appliquer',onclick:()=>url.value&&set(url.value)})),el('div',{className:'row'},pick),el('div',{className:'row'},'Ajustement :',fit)],{w:420,h:240})}

/* ===== Raccourcis web : App Store, Bureau, Mes apps ===== */
function renderDesk(){const c=$('#icons');c.innerHTML='';
  S.desk.map(id=>S.apps.find(a=>a.id==id)).filter(Boolean).forEach(a=>c.append(el('div',{className:'ic',ondblclick:()=>launch(a),onclick:e=>{if(e.target.tagName=='I')rmDesk(a.id);else if(matchMedia('(pointer:coarse)').matches)launch(a)}},
    el('i',{textContent:'×',title:'Retirer du bureau (reste dans l’App Store)'}),el('b',{textContent:a.icon||'🌐'}),el('span',{textContent:a.name}))))}
const rmDesk=id=>{S.desk=S.desk.filter(x=>x!=id);save();renderDesk()};
async function launch(a){
  if(a.mode=='tab')return open(a.url,'_blank','noopener');
  let src=a.url;
  if(S.proxy){try{const r=await(await fetch(S.proxy+'/api/check?url='+encodeURIComponent(a.url))).json();
    if(!r.proxiable)return open(a.url,'_blank','noopener');            // repli : nouvel onglet
    if(!r.embeddable)src=S.proxy+'/proxy?url='+encodeURIComponent(a.url)}catch{}}  // contournement via proxy
  const f=el('iframe',{src,referrerPolicy:'no-referrer'});
  win(a.name,[el('div',{className:'warn'},'Page vide ou bloquée par le site ? ',el('button',{textContent:'Ouvrir dans un onglet',onclick:()=>open(a.url,'_blank','noopener')}),S.proxy?'':' (proxy non configuré : voir Réglages)'),f],{w:700,h:480})}
function storeWin(){
  const n=el('input',{placeholder:'Nom'}),u=el('input',{placeholder:'https://…'}),i=el('input',{placeholder:'🌐',size:2,style:'flex:0 0 50px'}),cat=el('input',{placeholder:'Catégorie'}),
   m=el('select',{innerHTML:'<option value="window">Dans le bureau</option><option value="tab">Nouvel onglet</option>'}),list=el('div'),eid=null;let edit=null;
  const draw=()=>{list.innerHTML='';S.apps.forEach(a=>{const on=S.desk.includes(a.id);list.append(el('div',{className:'li'},el('span',{textContent:`${a.icon||'🌐'} ${a.name} · ${a.cat||'—'} · ${a.mode=='tab'?'onglet':'fenêtre'}`,onclick:()=>launch(a)}),
    el('button',{textContent:on?'Retirer du bureau':'Mettre sur le bureau',onclick:()=>{S.desk=on?S.desk.filter(x=>x!=a.id):[...S.desk,a.id];save();renderDesk();draw()}}),
    el('button',{textContent:'Éditer',onclick:()=>{edit=a;n.value=a.name;u.value=a.url;i.value=a.icon||'';cat.value=a.cat||'';m.value=a.mode}}),
    el('button',{textContent:'Supprimer',title:'Suppression définitive',onclick:()=>{if(confirm('Supprimer définitivement « '+a.name+' » ?')){S.apps=S.apps.filter(x=>x!=a);S.desk=S.desk.filter(x=>x!=a.id);save();renderDesk();draw()}}})))});
    if(!S.apps.length)list.append(el('small',{textContent:'Aucune app : ajoutez un raccourci ci-dessus.'}))};
  win('App Store',[el('div',{className:'row'},n,u),el('div',{className:'row'},i,cat,m,el('button',{textContent:'Enregistrer',onclick:()=>{if(!n.value||!/^https?:\/\//.test(u.value))return alert('Nom et URL http(s) requis');
    const d={name:n.value,url:u.value,icon:i.value,cat:cat.value,mode:m.value};if(edit)Object.assign(edit,d);else S.apps.push({id:uid(),...d});edit=null;n.value=u.value=i.value=cat.value='';save();renderDesk();draw()}})),list],{w:640,h:420});draw()}
function myApps(){win('Mes apps',S.apps.length?S.apps.map(a=>el('div',{className:'li',onclick:()=>launch(a)},el('b',{textContent:a.icon||'🌐'}),el('span',{textContent:a.name}))):[el('small',{textContent:'Vide : ajoutez des apps dans l’App Store.'})],{w:320,h:360})}

/* ===== Stockages WebDAV / SFTP ===== */
const full=(c,p)=>(c.base||'').replace(/\/$/,'')+p,auth=c=>'Basic '+btoa(unescape(encodeURIComponent(c.user+':'+(mem[c.id]||''))));
const post=(path,b)=>fetch(S.proxy+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
const b64=async b=>btoa(String.fromCharCode(...new Uint8Array(await b.arrayBuffer())));
async function dav(c,method,p,body,h={}){const url=c.url.replace(/\/$/,'')+encodeURI(full(c,p));
  const r=S.proxy?await post('/api/dav',{url,method,headers:h,auth:auth(c),b64:body&&await b64(body)}):await fetch(url,{method,headers:{...h,Authorization:auth(c)},body});
  if(!r.ok&&r.status!=207)throw Error('HTTP '+r.status+(S.proxy?'':' (CORS ? configurez le proxy)'));return r}
const FS={
  async list(c,p){if(c.type=='sftp'){if(!S.proxy)throw Error('SFTP nécessite le proxy (Réglages)');return(await post('/api/sftp/list',{conn:{...c,pass:mem[c.id]},path:full(c,p)})).json()}
    const x=new DOMParser().parseFromString(await(await dav(c,'PROPFIND',p,null,{Depth:'1'})).text(),'text/xml'),out=[];
    [...x.getElementsByTagNameNS('*','response')].slice(1).forEach(r=>{const g=t=>(r.getElementsByTagNameNS('*',t)[0]||{}).textContent;
      out.push({name:decodeURIComponent(g('href').replace(/\/$/,'').split('/').pop()),dir:!!r.getElementsByTagNameNS('*','collection').length,size:+g('getcontentlength')||0})});return out},
  async read(c,p){if(c.type=='sftp')return(await post('/api/sftp/read',{conn:{...c,pass:mem[c.id]},path:full(c,p)})).blob();return(await dav(c,'GET',p)).blob()},
  async write(c,p,b){if(c.type=='sftp')return post('/api/sftp/write',{conn:{...c,pass:mem[c.id]},path:full(c,p),b64:await b64(b)});return dav(c,'PUT',p,b)}};
const J=(...a)=>a.join('/').replace(/\/+/g,'/');
function connWin(){const list=el('div'),f={};
  const fields=[['name','Nom'],['type','dav'],['url','URL WebDAV'],['host','Hôte SFTP'],['port','Port'],['user','Utilisateur'],['pass','Mot de passe'],['base','Chemin de base (/)']];
  const ins=fields.map(([k,l])=>f[k]=k=='type'?el('select',{innerHTML:'<option value="dav">WebDAV</option><option value="sftp">SFTP</option>'}):el('input',{placeholder:l,type:k=='pass'?'password':'text'}));
  const draw=()=>{list.innerHTML='';S.conns.forEach(c=>list.append(el('div',{className:'li'},el('span',{textContent:`${c.type.toUpperCase()} · ${c.name}`}),
    el('button',{textContent:'Ouvrir',onclick:()=>{if(mem[c.id]==null)mem[c.id]=prompt('Mot de passe pour '+c.name+' ?')||'';explorer(c)}}),
    el('button',{textContent:'Supprimer',onclick:()=>{S.conns=S.conns.filter(x=>x!=c);save();draw()}}))))};
  win('Stockages cloud',[el('div',{className:'row'},...ins),el('div',{className:'row'},el('button',{textContent:'Ajouter la connexion',onclick:()=>{const c={id:uid()};fields.forEach(([k])=>c[k]=f[k].value);mem[c.id]=c.pass;delete c.pass;S.conns.push(c);save();draw()}}),
    el('small',{textContent:'Mot de passe gardé en mémoire (jamais écrit sur disque).'})),list],{w:620,h:420});draw()}
function explorer(c){let p='/';const list=el('div'),path=el('b'),loc=el('input',{type:'file',multiple:true,onchange:()=>openFile(null,null,[...loc.files].map(f=>({name:f.name,blob:f})),0)});
  const ld=async q=>{try{const it=(await FS.list(c,q)).sort((a,b)=>b.dir-a.dir||a.name.localeCompare(b.name));p=q;path.textContent=c.name+' : '+p;list.innerHTML='';
    if(p!='/')list.append(el('div',{className:'li',onclick:()=>ld(J(p,'..').replace(/[^/]+\/\.\.$/,'')||'/')},'⬆ ..'));
    const files=it.filter(x=>!x.dir).map(x=>({name:x.name,c,path:J(p,x.name)}));
    it.forEach(x=>list.append(el('div',{className:'li',onclick:()=>x.dir?ld(J(p,x.name)):openFile(c,J(p,x.name),files,files.findIndex(f=>f.name==x.name))},el('span',{textContent:(x.dir?'📁 ':'📄 ')+x.name}),el('small',{textContent:x.dir?'':Math.round(x.size/1024)+' Ko'}))))}
   catch(e){list.innerHTML='';list.append(el('div',{className:'warn'},e.message+' — '),el('button',{textContent:'Ouvrir dans un onglet',onclick:()=>open(c.url||'about:blank','_blank','noopener')}))}};
  win('Explorateur — '+c.name,[el('div',{className:'row'},path,el('button',{textContent:'🎵 Lire le dossier',onclick:()=>{const q=[...list.querySelectorAll('.li')].length&&curFiles(c,p);q.then(a=>a.length?player(a,0):alert('Aucun audio'))}}),el('button',{textContent:'📝 Nouveau texte',onclick:()=>editor('sans-titre.txt','',{c,path:J(p,'sans-titre.txt')})}),loc),list],{w:560,h:420});ld(p)}
const curFiles=async(c,p)=>(await FS.list(c,p)).filter(x=>!x.dir&&/^(mp3|ogg|wav|flac|m4a|aac|opus)$/.test(ext(x.name))).map(x=>({name:x.name,c,path:J(p,x.name)}));
const blobOf=t=>t.blob?Promise.resolve(t.blob):FS.read(t.c,t.path);
async function openFile(c,p,files,i){const t=files[i],e=ext(t.name),b=await blobOf(t).catch(x=>alert(x.message));if(!b)return;
  if(/^(mp3|ogg|wav|flac|m4a|aac|opus)$/.test(e))return player(files.filter(f=>/^(mp3|ogg|wav|flac|m4a|aac|opus)$/.test(ext(f.name))),files.filter(f=>/^(mp3|ogg|wav|flac|m4a|aac|opus)$/.test(ext(f.name))).indexOf(t));
  const u=URL.createObjectURL(b);
  if(/^(mp4|webm|ogv|mov)$/.test(e))win(t.name,[el('video',{src:u,controls:true,autoplay:true})],{w:640,h:400,onclose:()=>URL.revokeObjectURL(u)});
  else if(/^(png|jpe?g|gif|webp|svg|bmp)$/.test(e))win(t.name,[el('img',{src:u})],{w:520,h:400,onclose:()=>URL.revokeObjectURL(u)});
  else if(e=='pdf')win(t.name,[el('iframe',{src:u})],{w:640,h:480});
  else{const x=await b.text();editor(t.name,/^(html?|vdtxt)$/.test(e)?x:x.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])).replace(/\n/g,'<br>'),t.c?{c:t.c,path:t.path}:null)}}

/* ===== Lecteur de musique + playlists ===== */
const P={q:[],i:0,a:new Audio(),loop:0,shuf:false,w:null};
function player(q,i){P.q=q;P.i=Math.max(0,i);if(!P.w||!P.w.isConnected)buildPlayer();play(P.i)}
async function play(i){P.i=i;const t=P.q[i];if(!t)return;try{const b=await blobOf(t);URL.revokeObjectURL(P.a.src);P.a.src=URL.createObjectURL(b);P.a.play();P.now.textContent='♪ '+t.name;drawQ()}catch(e){P.now.textContent=e.message}}
const next=d=>{if(!P.q.length)return;let n=P.shuf?Math.floor(Math.random()*P.q.length):P.i+d;if(n>=P.q.length){if(!P.loop)return;n=0}if(n<0)n=P.q.length-1;play(n)};
let drawQ=()=>{};
function buildPlayer(){P.now=el('b',{textContent:'—'});const pr=el('input',{type:'range',min:0,max:1000,value:0,oninput:()=>P.a.currentTime=P.a.duration*pr.value/1000}),tm=el('small'),
  vol=el('input',{type:'range',min:0,max:1,step:.01,value:P.a.volume,oninput:()=>P.a.volume=vol.value}),ql=el('div'),sel=el('select');
  const loopB=el('button',{textContent:'🔁 off',onclick:()=>{P.loop=(P.loop+1)%3;loopB.textContent=['🔁 off','🔁 tout','🔂 piste'][P.loop]}}),shB=el('button',{textContent:'🔀 off',onclick:()=>{P.shuf=!P.shuf;shB.textContent='🔀 '+(P.shuf?'on':'off')}});
  const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00',ps=()=>{sel.innerHTML='<option value="">Playlist…</option>'+Object.keys(S.pl).map(k=>`<option>${k}</option>`).join('')};
  P.a.ontimeupdate=()=>{pr.value=P.a.duration?P.a.currentTime/P.a.duration*1000:0;tm.textContent=fmt(P.a.currentTime)+' / '+fmt(P.a.duration)};
  P.a.onended=()=>P.loop==2?play(P.i):next(1);
  drawQ=()=>{ql.innerHTML='';P.q.forEach((t,k)=>ql.append(el('div',{className:'li'+(k==P.i?' on':''),onclick:()=>play(k)},el('span',{textContent:t.name}))))};
  const pl=()=>S.pl[sel.value];
  P.w=win('Lecteur de musique',[P.now,pr,el('div',{className:'row'},tm,el('button',{textContent:'⏮',onclick:()=>next(-1)}),el('button',{textContent:'⏯',onclick:()=>P.a.paused?P.a.play():P.a.pause()}),el('button',{textContent:'⏭',onclick:()=>next(1)}),loopB,shB,'🔊',vol),
   el('div',{className:'row'},sel,el('button',{textContent:'Charger',onclick:()=>{if(pl()){P.q=pl().map(t=>({...t,c:S.conns.find(c=>c.id==t.cid)}));play(0)}}}),
    el('button',{textContent:'Nouvelle',onclick:()=>{const n=prompt('Nom de la playlist ?');if(n){S.pl[n]=[];save();ps();sel.value=n}}}),
    el('button',{textContent:'+ piste',onclick:()=>{const t=P.q[P.i];if(!pl()||!t||!t.c)return alert('Choisissez une playlist et une piste d’un stockage connecté');pl().push({name:t.name,cid:t.c.id,path:t.path});save()}}),
    el('button',{textContent:'Suppr.',onclick:()=>{delete S.pl[sel.value];save();ps()}})),ql],{w:480,h:460,onclose:()=>P.a.pause()});ps();drawQ()}

/* ===== Éditeur de texte enrichi ===== */
function editor(name,html,dest){const ed=el('div',{id:'ed',contentEditable:true,innerHTML:html}),nm=el('input',{value:name}),cmd=(c,v)=>{ed.focus();document.execCommand(c,false,v)},
  B=(t,c,v)=>el('button',{innerHTML:t,onmousedown:e=>{e.preventDefault();cmd(c,v)}}),
  docs=el('select',{innerHTML:'<option value="">Espace de travail…</option>'+Object.keys(S.docs).map(k=>`<option>${k}</option>`).join(''),onchange:()=>{if(docs.value){nm.value=docs.value;ed.innerHTML=S.docs[docs.value]}}}),
  dl=(n,t,m)=>{const a=el('a',{href:URL.createObjectURL(new Blob([t],{type:m})),download:n});a.click()};
  win('Éditeur',[el('div',{className:'row'},nm,docs),el('div',{className:'row'},B('<b>G</b>','bold'),B('<i>I</i>','italic'),B('<u>S</u>','underline'),B('<s>B</s>','strikeThrough'),B('H1','formatBlock','h2'),B('¶','formatBlock','p'),B('• Liste','insertUnorderedList'),B('1. Liste','insertOrderedList'),B('⬅','justifyLeft'),B('↔','justifyCenter'),B('➡','justifyRight'),
   el('select',{innerHTML:[1,2,3,4,5,6,7].map(n=>`<option value="${n}"${n==3?' selected':''}>Taille ${n}</option>`).join(''),onchange:e=>cmd('fontSize',e.target.value)}),
   el('input',{type:'color',title:'Couleur du texte',value:'#000000',oninput:e=>cmd('foreColor',e.target.value)}),el('input',{type:'color',title:'Surlignage',value:'#ffff00',oninput:e=>cmd('hiliteColor',e.target.value)}),
   el('button',{textContent:'🔗 Lien',onmousedown:e=>{e.preventDefault();const u=prompt('URL du lien ?','https://');u&&cmd('createLink',u)}})),ed,
   el('div',{className:'row'},el('button',{textContent:'Enregistrer (espace de travail)',onclick:()=>{S.docs[nm.value]=ed.innerHTML;save();alert('Enregistré')}}),
